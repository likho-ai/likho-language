[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "likho-language"
version = "0.1.0"
description = "Likho language service: Hinglish transliteration, spelling table, glossary and language policy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "likho-contracts",
    "likho-hinglish",
    "grpcio>=1.70",
    "grpcio-health-checking>=1.70",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "nats-py>=2.9",
    "pydantic-settings>=2.6",
]

[project.scripts]
likho-language = "likho_language.__main__:main"
likho-language-seed = "likho_language.seed:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
likho-hinglish = { workspace = true }
likho-contracts = { git = "https://github.com/likho-ai/likho-contracts", tag = "v0.1.0", subdirectory = "packages/python" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "jsonschema>=4.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/likho_language"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "packages/likho-hinglish/src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF", "ASYNC"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Devanagari strings are intentional, not "ambiguous" characters
]

[tool.ruff.lint.per-file-ignores]
"src/likho_language/grpc_server.py" = ["N802"]  # gRPC method names are CamelCase by contract

[tool.mypy]
python_version = "3.12"
files = ["src", "packages/likho-hinglish/src"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# likho.* is the generated contracts package: it ships .pyi stubs but no py.typed marker yet.
module = ["grpc.*", "grpc_health.*", "nats.*", "likho.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q"
markers = ["integration: needs PostgreSQL and NATS from likho-infra (bash scripts/up.sh)"]
