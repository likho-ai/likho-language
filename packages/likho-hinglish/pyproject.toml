[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "likho-hinglish"
version = "0.1.0"
description = "Devanagari (Hindi/Urdu) to Hinglish transliteration: rules plus a spelling table. No dependencies."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/likho_hinglish"]
